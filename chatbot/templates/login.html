<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="Login">
    <h1> Chatbot Login</h1>
    <!--Login Form-->

    <form method = "POST" action ="{{ url_for('login') }}">
        <h2>Username</h2>
        <input type="text" name = "UsernameL" placeholder="Your Username here">

        <h2>Password</h2>
        <input type="password" name = "PasswordL" placeholder="Your Password here">

        <input type="submit" value="Log In">

        <h4> Not a User ? <a href = "{{url_for('signup')}}">Signup</a></h4>

    </form>

    <!--flash message from flask-->
    </div>
    {% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}
</body>
</html>
